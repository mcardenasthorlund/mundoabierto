<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Abierto 3D</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Pantalla de inicio: pide el nombre antes de conectar -->
  <div id="start-screen">
    <div class="panel">
      <h1>Mundo Abierto 3D</h1>
      <p>Multijugador: comparte el mundo con otros jugadores.</p>
      <label for="name-input">Tu nombre</label>
      <input id="name-input" type="text" maxlength="20" placeholder="Jugador" autocomplete="off">
      <button id="start-btn">Entrar</button>
      <div id="status-msg"></div>
    </div>
  </div>

  <div id="hud">
    <h1>Mundo Abierto 3D</h1>
    <p>Flechas/joystick: moverse &middot; Rat&oacute;n: direcci&oacute;n &middot; Espacio/clic/toque: saltar</p>
  </div>

  <!-- Botón de alternar día/noche -->
  <button id="light-toggle" type="button" aria-label="Cambiar día/noche" title="Cambiar día/noche">
    <svg id="light-sun" viewBox="0 0 24 24" width="26" height="26" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="4"/>
      <line x1="12" y1="20" x2="12" y2="22"/>
      <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/>
      <line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/>
      <line x1="2" y1="12" x2="4" y2="12"/>
      <line x1="20" y1="12" x2="22" y2="12"/>
      <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/>
      <line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/>
    </svg>
    <svg id="light-moon" viewBox="0 0 24 24" width="26" height="26" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <!-- Joystick táctil para móviles (se muestra al detectar un toque) -->
  <div id="touch-ui">
    <div id="joystick">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <!-- Chat entre jugadores: botón flotante + panel (esquina inferior derecha) -->
  <button id="chat-toggle" type="button" aria-label="Abrir chat">
    <svg id="chat-icon" viewBox="0 0 24 24" width="26" height="26" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      <line x1="8" y1="10" x2="16" y2="10"/>
      <line x1="8" y1="14" x2="12" y2="14"/>
    </svg>
    <span id="chat-badge"></span>
  </button>
  <div id="chat-panel">
    <div id="chat-title">Chat</div>
    <div id="chat-messages"></div>
    <div id="chat-compose">
      <input id="chat-input" type="text" maxlength="200" placeholder="Escribe un mensaje…" autocomplete="off">
      <button id="chat-send" type="button">Enviar</button>
    </div>
  </div>

  <!-- Interacción con NPCs: ventana de pregunta y ventana de mensaje -->
  <div id="npc-prompt" class="npc-dialog">
    <div class="npc-panel">
      <p id="npc-prompt-text"></p>
      <div class="npc-actions">
        <button id="npc-prompt-yes" type="button">S&iacute;</button>
        <button id="npc-prompt-no" type="button">No</button>
      </div>
    </div>
  </div>
  <div id="npc-message" class="npc-dialog">
    <div class="npc-panel">
      <h2 id="npc-message-title"></h2>
      <p id="npc-message-text"></p>
      <div class="npc-actions">
        <button id="npc-message-close" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Versión del juego -->
  <div id="version">v0.2-alpha</div>

  <div id="error"></div>

  <!-- Scripts en orden de dependencia (sin ES modules para funcionar desde file://) -->
  <script src="js/Math3D.js"></script>
  <script src="js/Shader.js"></script>
  <script src="js/Lighting.js"></script>
  <script src="js/Renderer.js"></script>
  <script src="js/InputManager.js"></script>
  <script src="js/Camera.js"></script>
  <script src="js/NetClient.js"></script>
  <script src="js/Obstacle.js"></script>
  <script src="js/Tree.js"></script>
  <script src="js/Mountain.js"></script>
  <script src="js/World.js"></script>
  <script src="js/Humanoid.js"></script>
  <script src="js/Character.js"></script>
  <script src="js/Player.js"></script>
  <script src="js/RemotePlayer.js"></script>
  <script src="js/NPC.js"></script>
  <script src="js/Sky.js"></script>
  <script src="js/ChatUI.js"></script>
  <script src="js/NpcUI.js"></script>
  <script src="js/Game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
